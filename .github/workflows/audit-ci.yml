name: Identity Auditor CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  test:
    name: Run Pester Tests & Security Audit Pipeline
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Pester & Dependencies
        shell: pwsh
        run: |
          Install-Module -Name Pester -RequiredVersion 4.10.1 -Force -SkipPublisherCheck -Scope CurrentUser

      - name: Execute Automated Unit Tests
        shell: pwsh
        run: |
          Import-Module Pester -RequiredVersion 4.10.1 -Force
          Import-Module ./src/IdentityAuditor.psd1 -Force
          $result = Invoke-Pester -Path "./tests/IdentityAuditor.Tests.ps1" -PassThru
          if ($result.FailedCount -gt 0) {
            throw "$($result.FailedCount) test(s) failed."
          }

      - name: Run Framework in Simulation Mode
        shell: pwsh
        run: |
          ./Start-Audit.ps1 -SimulationMode -OutputPath "./Artifacts"

      - name: Upload Audit Reports Artifact
        uses: actions/upload-artifact@v4
        with:
          name: identity-audit-telemetry-reports
          path: ./Artifacts/
